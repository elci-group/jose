repo_path = "."

[watch]
path = "."
recursive = true
ignore_file = ".kaptainignore"

[cluster]
window = 5

[trust]
execution = "trusted"

[operation]
mode = "actuate"

[test]
command = "cargo test"
required = true

[staging]
mode = "cluster"

[push]
enabled = true
branch = "main"

[capabilities]
network_push = true
